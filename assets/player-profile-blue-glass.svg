<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="768" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Player profile mockup with blue glass background</title>
  <desc id="desc">A revised player profile screen that replaces bright white background panels with blue glass surfaces.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d5da2"/>
      <stop offset="55%" stop-color="#21457c"/>
      <stop offset="100%" stop-color="#17305c"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7f0ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8ec8ff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="heroFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8fbfff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="panelLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d8edff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="namePlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfe3f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#dff0ff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="xpTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e4e87"/>
      <stop offset="100%" stop-color="#f1f4fb"/>
    </linearGradient>
    <linearGradient id="xpFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a00ff"/>
      <stop offset="100%" stop-color="#d34fff"/>
    </linearGradient>
    <linearGradient id="greenButton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48d56d"/>
      <stop offset="100%" stop-color="#269f42"/>
    </linearGradient>
    <linearGradient id="blueButton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ab8ff"/>
      <stop offset="100%" stop-color="#1477d1"/>
    </linearGradient>
    <linearGradient id="yellowButton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd934"/>
      <stop offset="100%" stop-color="#cfa800"/>
    </linearGradient>
    <linearGradient id="purpleButton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a325ff"/>
      <stop offset="100%" stop-color="#5d00b8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0e1a35" flood-opacity="0.3"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#102240" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="768" height="1024" fill="url(#bgGradient)"/>

  <g opacity="0.14" stroke="#d8eaff" stroke-width="2">
    <path d="M0 80 H768"/>
    <path d="M0 160 H768"/>
    <path d="M0 240 H768"/>
    <path d="M0 320 H768"/>
    <path d="M0 400 H768"/>
    <path d="M0 480 H768"/>
    <path d="M0 560 H768"/>
    <path d="M0 640 H768"/>
    <path d="M0 720 H768"/>
    <path d="M0 800 H768"/>
    <path d="M0 880 H768"/>
    <path d="M0 960 H768"/>
    <path d="M80 0 V1024"/>
    <path d="M160 0 V1024"/>
    <path d="M240 0 V1024"/>
    <path d="M320 0 V1024"/>
    <path d="M400 0 V1024"/>
    <path d="M480 0 V1024"/>
    <path d="M560 0 V1024"/>
    <path d="M640 0 V1024"/>
    <path d="M720 0 V1024"/>
  </g>

  <g opacity="0.18" fill="#ffffff">
    <path d="M106 0 h46 l-100 1024 h-46z"/>
    <path d="M258 0 h28 l-95 1024 h-28z"/>
    <path d="M564 0 h54 l-112 1024 h-54z"/>
  </g>

  <circle cx="726" cy="972" r="7" fill="#ffffff" opacity="0.75"/>
  <path d="M726 944 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z" fill="#ffffff" opacity="0.85"/>

  <text x="384" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="1" fill="#ffffff" filter="url(#textShadow)">PLAYER PROFILE</text>

  <g filter="url(#softShadow)">
    <rect x="104" y="138" width="560" height="230" rx="14" fill="url(#heroFill)" stroke="url(#panelLine)" stroke-width="3"/>
    <rect x="106" y="388" width="560" height="520" rx="14" fill="url(#cardFill)" stroke="url(#panelLine)" stroke-width="3"/>
  </g>

  <g opacity="0.55">
    <rect x="325" y="207" width="337" height="44" fill="url(#namePlate)"/>
    <rect x="370" y="265" width="256" height="28" fill="url(#namePlate)"/>
  </g>

  <g>
    <rect x="140" y="204" width="150" height="126" fill="#e3eff8" fill-opacity="0.88"/>
    <rect x="183" y="255" width="44" height="34" fill="none" stroke="#bbc7d2" stroke-width="3"/>
    <circle cx="203" cy="269" r="5" fill="none" stroke="#bbc7d2" stroke-width="3"/>
    <path d="M191 285 l10 -11 8 8 11 -18 19 21" fill="none" stroke="#bbc7d2" stroke-width="3"/>
  </g>

  <text x="489" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#f7fbff" filter="url(#textShadow)">PlayerOne</text>
  <text x="500" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#f7fbff" filter="url(#textShadow)">Level: 25</text>

  <g>
    <rect x="328" y="336" width="336" height="24" rx="12" fill="url(#xpTrack)"/>
    <rect x="328" y="336" width="208" height="24" rx="12" fill="url(#xpFill)"/>
    <text x="496" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">XP: 124 / Required XP: 200</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="126" y="408" width="520" height="90" rx="12" fill="url(#cardFill)" stroke="url(#panelLine)" stroke-width="3"/>
    <rect x="126" y="514" width="520" height="90" rx="12" fill="url(#cardFill)" stroke="url(#panelLine)" stroke-width="3"/>
    <rect x="126" y="620" width="520" height="90" rx="12" fill="url(#cardFill)" stroke="url(#panelLine)" stroke-width="3"/>
    <rect x="126" y="726" width="520" height="90" rx="12" fill="url(#cardFill)" stroke="url(#panelLine)" stroke-width="3"/>
  </g>

  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.96">
    <circle cx="156" cy="448" r="7"/>
    <path d="M156 458 l-12 21 14 0 7 20"/>
    <path d="M156 469 l18 12"/>
    <path d="M155 478 l-18 15"/>

    <path d="M145 556 l20 -42 14 14 -18 45z" fill="#ffffff" stroke="none"/>

    <rect x="121" y="642" width="36" height="24" rx="5"/>
    <circle cx="131" cy="654" r="3" fill="#21457c"/>
    <circle cx="147" cy="654" r="3" fill="#21457c"/>
    <path d="M157 654 h15"/>
    <path d="M118 674 h56"/>

    <text x="120" y="784" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff" stroke="none">XP</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" filter="url(#textShadow)">
    <text x="222" y="466">Walkspeed : 18.5 km/h</text>
    <text x="222" y="572">Stamina : 95%</text>
    <text x="222" y="678">TapesBoost : 2.5x</text>
    <text x="222" y="784">XpBoost : 1.75x</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="602" y="422" width="62" height="62" rx="12" fill="url(#greenButton)"/>
    <rect x="602" y="528" width="62" height="62" rx="12" fill="url(#blueButton)"/>
    <rect x="602" y="634" width="62" height="62" rx="12" fill="url(#yellowButton)"/>
    <rect x="602" y="740" width="62" height="62" rx="12" fill="url(#purpleButton)"/>
  </g>

  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.96">
    <path d="M626 453 h16"/>
    <path d="M626 453 l16 -16"/>
    <path d="M626 453 l16 16"/>

    <path d="M621 559 h22"/>
    <path d="M632 548 v22"/>

    <path d="M621 665 h22"/>
    <path d="M632 654 v22"/>

    <path d="M621 771 h22"/>
    <path d="M632 760 v22"/>
  </g>

  <path d="M104 832 h560" stroke="#dfefff" stroke-opacity="0.42" stroke-width="3"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" filter="url(#textShadow)">
    <text x="212" y="876" text-anchor="middle">Inventory : 12 &#8250;</text>
    <text x="390" y="876" text-anchor="middle">Achievements : 5 &#8250;</text>
    <text x="586" y="876" text-anchor="middle">Stats : 4 &#8250;</text>
  </g>
</svg>
